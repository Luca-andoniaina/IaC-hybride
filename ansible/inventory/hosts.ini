[linux]
debian ansible_host=192.168.88.13 ansible_ssh_private_key_file=keys/debian_key
almalinux ansible_host=192.168.88.11 ansible_ssh_private_key_file=keys/almalinux_key

[linux:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3

[windows]
winserver ansible_host=192.168.88.10

[windows:vars]
ansible_user=vagrant
ansible_password={{ vault_windows_password }}
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_winrm_server_cert_validation=ignore
ansible_port=5985