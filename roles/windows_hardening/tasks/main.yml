---
- name: Journaliser le passage du durcissement
  ansible.builtin.debug:
    msg: "Durcissement CIS niveau 1 appliqué sur {{ inventory_hostname }}"

- name: Pare-feu local Windows
  tags: [firewall]
  block:
    - name: Autoriser WinRM HTTPS depuis le nœud de contrôle uniquement
      community.windows.win_firewall_rule:
        name: "IaC - WinRM HTTPS depuis le noeud de controle"
        direction: in
        action: allow
        protocol: tcp
        localport: "5986"
        remoteip: "{{ firewall_control_node_ip }}"
        profiles: [domain, private, public]
        enabled: true
        state: present

    - name: Supprimer les règles WinRM ouvertes à tous (script d'amorçage et box Packer)
      community.windows.win_firewall_rule:
        name: "{{ item }}"
        state: absent
      loop:
        - "WinRM HTTPS (lab)"
        - "WinRM-Packer"

    - name: Bloquer le Bureau à distance en entrée
      community.windows.win_firewall_rule:
        name: "IaC - Blocage RDP entrant"
        direction: in
        action: block
        protocol: tcp
        localport: "3389"
        profiles: [domain, private, public]
        enabled: true
        state: present
